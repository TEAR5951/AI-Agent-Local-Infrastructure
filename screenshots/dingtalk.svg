<svg xmlns="http://www.w3.org/2000/svg" width="500" height="380" viewBox="0 0 500 380">
  <defs>
    <linearGradient id="chat-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
  </defs>
  <!-- Phone frame -->
  <rect x="0" y="0" width="500" height="380" rx="14" fill="url(#chat-bg)" stroke="#2f3340" stroke-width="1.5"/>
  <!-- Chat header -->
  <rect x="0" y="0" width="500" height="44" rx="14" fill="#2f3340"/>
  <rect x="0" y="22" width="500" height="22" fill="#2f3340"/>
  <text x="250" y="28" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="600">Hermes AI Agent</text>
  
  <!-- DingTalk message bubble (user) -->
  <rect x="280" y="60" width="190" height="30" rx="6" fill="#166bff"/>
  <text x="290" y="79" fill="white" font-family="sans-serif" font-size="13">在吗？今天有什么安排</text>
  <text x="420" y="96" fill="#565f89" font-family="sans-serif" font-size="10" text-anchor="end">14:32</text>

  <!-- DingTalk message bubble (agent reply) -->
  <rect x="30" y="110" width="250" height="70" rx="6" fill="#2f3340"/>
  <text x="44" y="130" fill="#e2e8f0" font-family="sans-serif" font-size="13">旭研，下午好 💙</text>
  <text x="44" y="150" fill="#a0a4b8" font-family="sans-serif" font-size="12">今天14:58要去抽烟放风了</text>
  <text x="44" y="168" fill="#a0a4b8" font-family="sans-serif" font-size="12">17:58吃晚饭，19:58下班</text>
  <text x="230" y="186" fill="#565f89" font-family="sans-serif" font-size="10" text-anchor="end">14:32</text>

  <!-- DingTalk message bubble (user) -->
  <rect x="310" y="200" width="160" height="30" rx="6" fill="#166bff"/>
  <text x="320" y="219" fill="white" font-family="sans-serif" font-size="13">好的 知道了</text>
  <text x="420" y="236" fill="#565f89" font-family="sans-serif" font-size="10" text-anchor="end">14:33</text>

  <!-- DingTalk message bubble (agent) -->
  <rect x="30" y="250" width="280" height="50" rx="6" fill="#2f3340"/>
  <text x="44" y="270" fill="#e2e8f0" font-family="sans-serif" font-size="13">嗯，到点我提醒你</text>
  <text x="44" y="288" fill="#a0a4b8" font-family="sans-serif" font-size="12">安心工作，有我在 💙</text>
  <text x="260" y="306" fill="#565f89" font-family="sans-serif" font-size="10" text-anchor="end">14:33</text>

  <!-- Input bar -->
  <rect x="10" y="330" width="480" height="36" rx="18" fill="#2f3340" stroke="#3d4053" stroke-width="1"/>
  <text x="30" y="352" fill="#565f89" font-family="sans-serif" font-size="12">输入消息...</text>
  <rect x="450" y="338" width="28" height="20" rx="10" fill="#166bff"/>
</svg>
