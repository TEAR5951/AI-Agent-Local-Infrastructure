<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'SF Mono','Menlo','Monaco','Cascadia Code','Consolas',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3c"/>
      <stop offset="100%" stop-color="#242438"/>
    </linearGradient>
  </defs>
  <!-- Terminal window -->
  <rect x="0" y="0" width="720" height="420" rx="8" fill="url(#bg)" stroke="#3b3b4a" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="32" rx="8" fill="url(#titlebar)"/>
  <rect x="0" y="16" width="720" height="16" fill="url(#titlebar)"/>
  <!-- Window buttons -->
  <circle cx="16" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="16" r="5" fill="#28c840"/>
  <!-- Title text -->
  <text x="360" y="22" text-anchor="middle" fill="#585b70" font-size="11" font-weight="600">hermes-agent — terminal</text>
  <!-- Content -->
  <text x="16" y="60" fill="#585b70" font-size="12">
    <tspan x="16" dy="0">$ hermes</tspan>
  </text>
  <!-- Divider line -->
  <text x="16" y="82" fill="#45475a" font-size="12">
    <tspan x="16" dy="0">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan>
  </text>
  <!-- Hermes banner -->
  <text x="16" y="104" fill="#89b4fa" font-size="13" font-weight="bold">
    <tspan x="16" dy="0">  🤖 Hermes Agent</tspan>
  </text>
  <text x="16" y="122" fill="#6c7086" font-size="11">
    <tspan x="16" dy="0">  Model: deepseek-v4-flash · Context: 1M tokens</tspan>
  </text>
  <text x="16" y="138" fill="#6c7086" font-size="11">
    <tspan x="16" dy="0">  Platform: dingtalk · Skills: 28 loaded</tspan>
  </text>
  <text x="16" y="158" fill="#45475a" font-size="12">
    <tspan x="16" dy="0">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan>
  </text>
  <!-- User message -->
  <text x="16" y="184" fill="#94e2d5" font-size="12" font-weight="bold">
    <tspan x="16" dy="0">User &gt;</tspan>
  </text>
  <text x="16" y="202" fill="#cdd6f4" font-size="12">
    <tspan x="16" dy="0">What tasks do I have today?</tspan>
  </text>
  <!-- Assistant message -->
  <text x="16" y="230" fill="#89b4fa" font-size="12" font-weight="bold">
    <tspan x="16" dy="0">Agent &gt;</tspan>
  </text>
  <text x="16" y="250" fill="#cdd6f4" font-size="12">
    <tspan x="16" dy="0">🔍 Checking scheduled jobs...</tspan>
  </text>
  <text x="16" y="270" fill="#a6e3a1" font-size="12">
    <tspan x="16" dy="0">  ✓ Vision server keepalive (every 1m)</tspan>
  </text>
  <text x="16" y="286" fill="#a6e3a1" font-size="12">
    <tspan x="16" dy="0">  ✓ 6 recurring reminders configured</tspan>
  </text>
  <text x="16" y="310" fill="#cdd6f4" font-size="12">
    <tspan x="16" dy="0">All systems running normally.</tspan>
  </text>
  <!-- Blinking cursor -->
  <rect x="16" y="338" width="8" height="15" rx="1" fill="#89b4fa" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Status bar -->
  <rect x="0" y="400" width="720" height="20" fill="#11111b" rx="0"/>
  <text x="16" y="414" fill="#585b70" font-size="10">NORMAL  dingtalk  deepseek-v4-flash  1M tokens</text>
</svg>
