version: '3.8'

services:
  vision-server:
    build: ./vision-server
    ports:
      - "8800:8800"
    environment:
      - VISION_HOST=0.0.0.0
      - VISION_PORT=8800
      - VISION_QUANTIZATION=4bit
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - ai-network

volumes:
  huggingface_cache:

networks:
  ai-network:
    driver: bridge
